<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Editor with Automatic Title Generation (Local Model)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous" defer></script>
        <script src="./generateTitle.js" defer></script>
    </head>
    <body>

        <div class="container-sm">

            <h1 class="text-center my-3">Editor with Automatic Title Generation (Local Model)</h1><!-- my-5: margin top+bottom -->

            <div id="alertPanelLocalAiStatus" class="alert d-none mb-5" role="alert">
            </div>

            <form>

                <div class="mb-5">
                    <label for="inputTitle" class="form-label fs-5 fw-bold">Title</label>
                    <input id="inputTitle" type="text" class="form-control"
                           placeholder="Title generated by the local AI model will appear here">
                </div>

                <div class="mb-3">
                    <label for="editor" class="form-label fs-5 fw-bold">Text</label>
                    <textarea id="editor" class="form-control" rows="12" disabled
                              placeholder="Write your report here"></textarea>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 mb-3">
                    <button id="buttonSuggestTitle"
                            type="button"
                            class="btn btn-primary flex-fill"
                            disabled
                            data-bs-toggle="tooltip"
                            data-bs-title="The number shown in the badge indicates how many preferred title suggestions are available.">
                        Suggest Title
                    </button>
                    <button id="buttonDelete" type="button" class="btn btn-danger flex-fill" >
                        Delete Title and Text
                    </button>
                </div>

                <div id="titleError" class="text-danger d-none" role="alert"></div>

            </form>

            <div id="alertPanelTitleGeneration" class="alert d-none" role="alert">
                    Alert text will be displayed here. It can be used to show success or error messages.
            </div>

        </div><!-- container-sm -->

    </body>
</html>
