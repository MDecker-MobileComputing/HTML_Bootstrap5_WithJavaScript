<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Single-Choice Quiz</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
    </head>
    <body>

        <div class="container-sm my-3">

            <h1 class="text-center mt-3 mb-5">Single-Choice Quiz (Bootstrap 5)</h1>

            <p>Which of the following cities is farthest north?</p>

            <div><!-- Form -->

                <select class="form-select" aria-label="Single-choice question about the northernmost city">
                    <option value="none" selected>Please select a city</option>
                    <option value="amsterdam">Amsterdam</option>
                    <option value="hamburg"  >Hamburg</option>
                    <option value="london"   >London</option>
                </select>

                <div class="mt-4">
                    <button id="checkAnswerButton" class="btn btn-primary">Check Answer</button>
                </div>

            </div><!-- Form -->


            <div id="resultModal" class="modal" tabindex="-1">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h1 id="resultModalTitle" class="modal-title">will be replaced</h1>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                      <p id="resultModalMessage"></p>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Continue</button>
                    </div>
                  </div>
                </div>
            </div>

       </div><!-- container -->

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
              integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
              crossorigin="anonymous"></script>
       <script src="./single-choice-question.js"></script>

    </body>
</html>
