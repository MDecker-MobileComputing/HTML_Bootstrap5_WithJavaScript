<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Get Answer Options from AI via Proxy</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
              integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk"
              crossorigin="anonymous"
              rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous" defer></script>
        <script src="./generateAnswerOptions.js" defer></script>
    </head>
    <body>

        <div class="container-sm">

            <h1 class="text-center my-3">Generate Answers for Single-Choice Questions</h1><!-- my-5: margin top+bottom -->

            <div id ="alertInfo" class="alert alert-info my-5" role="alert">
                Proxy must be running, see 
                <a href="https://github.com/MDecker-MobileComputing/Ionic_Gemini_AntwortenSingleChoice/tree/master/Proxy" 
                   target="_blank">here</a> for details.
            </div>

            <div class="row g-3">
                <div class="col-12">
                    <label for="question" class="form-label fw-bold">Single Choice Question:</label>
                    <textarea id="question" 
                              class="form-control" 
                              rows="3"
                              placeholder="Example: What is the capital of France?"></textarea>
                </div>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-12 col-md-6">
                    <button id="buttonGenerate" type="button" class="btn btn-primary w-100">Generate</button>
                </div>
                <div class="col-12 col-md-6">
                    <button id="buttonClear" type="button" class="btn btn-secondary w-100">Clear</button>
                </div>
            </div>

            <div id ="alertDanger" class="alert alert-danger my-2 d-none" role="alert">
                <!-- Text will be supplied at runtime -->
            </div>

            <div class="row g-3 mt-5 mb-4">
                <div class="col-12">
                    <label for="answerOption1" class="form-label fw-bold">Answer option 1 (correct answer):</label>
                    <div class="input-group">
                        <input id="answerOption1" type="text" class="form-control border-success bg-success-subtle" readonly>
                        <button type="button" class="btn btn-outline-success" data-copy-answer disabled
                                aria-label="Copy answer option 1 to clipboard" title="Copy to clipboard">
                            <i class="bi bi-clipboard" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="col-12">
                    <label for="answerOption2" class="form-label fw-bold">Answer option 2 (distractor):</label>
                    <div class="input-group">
                        <input id="answerOption2" type="text" class="form-control border-danger bg-danger-subtle" readonly>
                        <button type="button" class="btn btn-outline-danger" data-copy-answer disabled
                                aria-label="Copy answer option 2 to clipboard" title="Copy to clipboard">
                            <i class="bi bi-clipboard" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="col-12">
                    <label for="answerOption3" class="form-label fw-bold">Answer option 3 (distractor):</label>
                    <div class="input-group">
                        <input id="answerOption3" type="text" class="form-control border-danger bg-danger-subtle" readonly>
                        <button type="button" class="btn btn-outline-danger" data-copy-answer disabled
                                aria-label="Copy answer option 3 to clipboard" title="Copy to clipboard">
                            <i class="bi bi-clipboard" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="col-12">
                    <label for="answerOption4" class="form-label fw-bold">Answer option 4 (distractor):</label>
                    <div class="input-group">
                        <input id="answerOption4" type="text" class="form-control border-danger bg-danger-subtle" readonly>
                        <button type="button" class="btn btn-outline-danger" data-copy-answer disabled
                                aria-label="Copy answer option 4 to clipboard" title="Copy to clipboard">
                            <i class="bi bi-clipboard" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div><!-- container-sm -->

    </body>
</html>
