<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Bad News</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
    </head>
    <body>

        <div class="container-sm">

            <h1 class="text-center my-3">Bad News (Bootstrap 5)</h1><!-- my-5: margin top+bottom -->

            <p class="text-center fst-italic mb-5"><!-- fst: Font Style-->
                "Bad news travels at the speed of light; good news travels like
                <a href="https://www.dict.cc/?s=molasses" target="_blank">molasses</a>."
            </p>


            <div class="row gx-3 justify-content-center">
                <div class="d-flex align-items-center col-sm-8">
                    <label for="rangeCount" class="form-label me-2">Amount:</label>
                    <input id="rangeCount" class="form-range" type="range" min="1" max="30" value="5">
                    <div id="countDisplay" class="ms-2">5</div>
                </div>
            </div>

            <div class="row gx-3 justify-content-center mt-2">
                <div class="d-flex justify-content-center form-check col-sm-4">
                    <input id="checkboxDomesticOnly" class="form-check-input me-2" type="checkbox">
                    <label class="form-check-label" for="checkboxDomesticOnly">Domestic only</label>
                </div>
            </div>

            <div class="row gx-3 justify-content-center mt-3">
                <button id="buttonLoadNews" class="btn btn-primary col-sm-6">Load news</button>
            </div>
            <div class="row gx-3 justify-content-center mt-3">
                <button id="buttonReset" class="btn btn-secondary col-sm-6">Reset</button>
            </div>


            <div class="row justify-content-center mb-3">
                <div class="col-lg-8 col-md-10">
                    <ul id="listGroupNews" class="list-group mt-5">
                        <!-- news items are inserted here as child elements -->
                    </ul>
                </div>
            </div>

        </div><!-- container-sm -->

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
        <script src="./bad-news.js"></script>

    </body>
</html>
