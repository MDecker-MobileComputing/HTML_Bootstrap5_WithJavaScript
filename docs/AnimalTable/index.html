<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Table with Dynamic Highlights</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
    </head>
    <body>

        <div class="container-sm">

            <h1 class="text-center my-5">Table with Dynamic Highlights (Bootstrap 5)</h1><!-- my-5: margin top+bottom -->

            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Animal</th>
                        <th scope="col">Sound</th>
                        <th scope="col">Favorite food</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="pet">
                        <td>Cat</td>
                        <td>Meow</td>
                        <td>Fish</td>
                    </tr>
                    <tr class="herbivore">
                        <td>Cow</td>
                        <td>Moo</td>
                        <td>Grass</td>
                    </tr>
                    <tr class="pet">
                        <td>Dog</td>
                        <td>Woof</td>
                        <td>Bone</td>
                    </tr>
                    <tr>
                        <td>Duck</td>
                        <td>Quack</td>
                        <td>Bread</td>
                    </tr>
                    <tr class="herbivore">
                        <td>Sheep</td>
                        <td>Baa</td>
                        <td>Hay</td>
                    </tr>
                </tbody>
            </table>


            <h2 class="mt-5 mb-3">Row highlighting:</h2>

            <!--
                 Radio buttons that belong to the same group are defined using name="radioButton".
                 See also: https://getbootstrap.com/docs/5.3/forms/checks-radios/#radios

                 With fs-5, the font size is increased to 1.25rem (second-smallest step).
                 See also: https://getbootstrap.com/docs/5.3/utilities/text/#font-size
             -->
            <div class="form-check mb-3">
                <input id="radioOff" class="form-check-input" type="radio" name="radioGroup" value="off" checked>
                <label class="form-check-label fs-5" for="radioOff">Off</label>
            </div>
            <div class="form-check mb-3">
                <input id="radioZebra" class="form-check-input" type="radio" name="radioGroup" value="zebra">
                <label class="form-check-label fs-5" for="radioZebra">Alternating (zebra mode)</label>
            </div>
            <div class="form-check mb-3">
                <input id="radioHerbivores" class="form-check-input" type="radio" name="radioGroup" value="herbivores">
                <label class="form-check-label fs-5" for="radioHerbivores">Highlight (pure) herbivores</label>
            </div>
            <div class="form-check mb-3">
                <input id="radioPets" class="form-check-input" type="radio" name="radioGroup" value="pets">
                <label class="form-check-label fs-5" for="radioPets">Highlight pets</label>
            </div>

        </div><!-- container-sm -->


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
        <script src="./animal-table.js"></script>

    </body>
</html>
