<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Multiple-Choice Quiz</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
    </head>
    <body>

        <div class="container-sm my-3">

            <h1 class="text-center mt-3 mb-5">Multiple-Choice Quiz (Bootstrap 5)</h1>

            <p>Which of the following planets are closer to the Sun than Earth?</p>

            <div><!-- Form -->

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkboxJupiter" value="">
                    <label class="form-check-label" for="checkboxJupiter">Jupiter</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkboxMars" value="">
                    <label class="form-check-label" for="checkboxMars">Mars</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkboxMercury" value="">
                    <label class="form-check-label" for="checkboxMercury">Mercury</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkboxNeptune" value="">
                    <label class="form-check-label" for="checkboxNeptune">Neptune</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkboxSaturn" value="">
                    <label class="form-check-label" for="checkboxSaturn">Saturn</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkboxUranus" value="">
                    <label class="form-check-label" for="checkboxUranus">Uranus</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="checkboxVenus" value="">
                    <label class="form-check-label" for="checkboxVenus">Venus</label>
                </div>

                <div class="mt-4">
                    <button id="buttonAnswerCheck"
                            class="btn btn-primary"
                            data-bs-toggle="tooltip"
                            data-bs-title="Select at least one planet"
                            >Check answer</button>
                </div>

            </div><!-- Form -->


            <div id="modalResult" class="modal" tabindex="-1">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h1 id="modalResultTitle" class="modal-title">Result</h1>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                      <p id="modalResultMessage"></p>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Continue</button>
                    </div>
                  </div>
                </div>
            </div>

       </div><!-- container -->

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
              integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
              crossorigin="anonymous"></script>       
      <script src="./multiple-choice-question.js"></script>

    </body>
</html>
