<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Editor with Automatic Title Generation</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous" defer></script>
        <script src="./generateTitle.js" defer></script>
    </head>
    <body>

        <div class="container-sm">

            <h1 class="text-center my-3">Editor with Automatic Title Generation</h1><!-- my-5: margin top+bottom -->

            <form>

                <div class="mb-5">
                    <label for="inputTitle" class="form-label fs-5 fw-bold">Title</label>
                    <input id="inputTitle" type="text" class="form-control"
                           placeholder="Automatically generated title will appear here">
                </div>

                <div class="mb-3">
                    <label for="editor" class="form-label fs-5 fw-bold">Text</label>
                    <textarea id="editor" class="form-control" rows="12"
                              placeholder="Write your report here"></textarea>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 mb-3">
                    <button id="buttonSuggestTitle" type="button" class="btn btn-primary flex-fill">
                        Suggest Title
                        &nbsp;
                        <span id="badgeSuggestionCount" class="badge text-bg-secondary">1</span>
                    </button>
                    <button id="buttonDelete" type="button" class="btn btn-danger flex-fill" >
                        Delete Title and Text
                    </button>
                </div>

                <div id="titleError" class="text-danger d-none" role="alert"></div>

            </form>

            <div id="alertPanel" class="alert d-none" role="alert">
                    Alert text will be displayed here. It can be used to show success or error messages.
            </div>

            <div class="accordion mt-5 mb-2" id="accordionSettings">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button"
                                data-bs-toggle="collapse" data-bs-target="#collapseSettings"
                                aria-expanded="false" aria-controls="collapseSettings">
                            Settings
                        </button>
                    </h2>
                    <div id="collapseSettings" class="accordion-collapse collapse"
                         data-bs-parent="#accordionSettings">
                        <div class="accordion-body">

                            <div class="mb-4">
                                <label for="selectGeminiModel" class="form-label fw-bold">Gemini Model</label>
                                <select id="selectGeminiModel" class="form-select">
                                    <option value="gemini-2.5-flash-lite" selected>gemini-2.5-flash-lite</option>
                                    <option value="gemini-2.5-flash"              >gemini-2.5-flash</option>
                                    <option value="gemini-3.5-flash-lite"         >gemini-3.5-flash-lite</option>
                                    <option value="gemini-3.5-flash"              >gemini-3.5-flash</option>

                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="rangeSuggestionCount" class="form-label">
                                    Number of title suggestions per API request:
                                    <span id="suggestionCountValue">5</span>
                                </label>
                                <input id="rangeSuggestionCount" type="range" class="form-range"
                                       min="1" max="20" step="1" value="5">
                            </div>

                            <div class="mb-4">
                                <label for="rangeTemperature" class="form-label">
                                    Temperature: <span id="temperatureValue">1.0</span>
                                </label>
                                <input id="rangeTemperature" type="range" class="form-range"
                                       min="0" max="2" step="0.1" value="1">
                                <div class="form-text">The higher, the more creative the titles</div>
                            </div>

                            <div class="mb-3">
                                <label for="inputApiKey" class="form-label fw-bold">API Key for Gemini</label>
                                <input id="inputApiKey" type="password" class="form-control"
                                       autocomplete="off">
                            </div>

                            <button id="buttonCheckApiKey" type="button" class="btn btn-primary w-100 mb-3">
                                Check and Save API Key
                            </button>

                            <div id="apiKeyMessage" class="d-none" role="alert"></div>

                        </div>
                    </div>

                </div>
            </div><!-- accordion -->

        </div><!-- container-sm -->

    </body>
</html>
