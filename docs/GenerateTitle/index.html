<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" >
        <title>Bootstrap 5: Editor with Automatic Title Generation</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous"
              rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous" defer></script>
        <script src="./generateTitle.js" defer></script>
    </head>
    <body>

        <div class="container-sm">

            <h1 class="text-center my-3">Editor with Automatic Title Generation</h1><!-- my-5: margin top+bottom -->

            <form>

                <div class="mb-5">
                    <label for="title" class="form-label fs-5 fw-bold">Title</label>
                    <input id="title" type="text" class="form-control"
                           placeholder="e.g., Daily report from 05/08/2026">
                </div>

                <div class="mb-3">
                    <label for="text" class="form-label fs-5 fw-bold">Text</label>
                    <textarea class="form-control" id="text" rows="12"
                              placeholder="Write your report here"></textarea>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-2 mb-3">
                    <button id="buttonGenerateTitleSuggestion" type="button" class="btn btn-primary flex-fill">
                        Generate Title Suggestion
                    </button>
                    <button id="buttonDelete" type="button" class="btn btn-danger flex-fill" >
                        Delete Title and Text
                    </button>
                </div>

                <div id="titleError" class="text-danger d-none" role="alert"></div>

            </form>

        </div><!-- container-sm -->

    </body>
</html>
